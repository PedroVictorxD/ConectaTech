# ===========================
# ConectaTech API - Perfil PROD
# ===========================

# PostgreSQL (variaveis de ambiente obrigatorias)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA - sem SQL no log, validar schema apenas
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# JWT (variavel de ambiente obrigatoria)
jwt.secret=${JWT_SECRET}

# Jooble API
jooble.api.key=${JOOBLE_API_KEY}

# CORS (restrito)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Email (Brevo SMTP recomendado)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM}

# Logging
logging.level.br.com.unp.conectatech=INFO
logging.level.org.springframework.security=WARN
