# ===========================
# ConectaTech API - Configurações
# ===========================

# Servidor
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/conectatech
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=ConectaTechSecretKey2026UNPMossoroExtensaoProjetoSeguro
jwt.expiration=86400000

# Jooble API
jooble.api.url=https://jooble.org/api/
jooble.api.key=${JOOBLE_API_KEY:fa61f76b-ffb4-46e8-9715-72366fc3c145}

# Scraper
scraper.cron=0 0 6 * * ?
scraper.enabled=false

# Scraper Target Configuration
# IMPORTANTE: Configure a URL e seletores CSS para um site com HTML server-rendered.
# O CIEE (portal.ciee.org.br) é uma SPA React e NÃO funciona com JSoup.
# Pesquise a estrutura HTML do site alvo com: curl -s -A "Mozilla/5.0" "URL" | head -200
scraper.target.url=https://portal.ciee.org.br/estudantes/vagas/?cidade=Mossoro
scraper.target.card-selector=.vaga-card, .job-listing, .vacancy-item, article.vaga
scraper.target.title-selector=.titulo, .job-title, h2, h3
scraper.target.company-selector=.empresa, .company-name, .employer
scraper.target.description-selector=.descricao, .job-description, .snippet, p
scraper.target.location-selector=.localizacao, .location, .city
scraper.target.link-selector=a
scraper.target.cidade=Mossoró

# Logging
logging.level.br.com.unp.conectatech=DEBUG
logging.level.org.springframework.security=INFO
