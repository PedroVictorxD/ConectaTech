# ===========================
# ConectaTech API - Configuracoes Base
# ===========================

# Perfil padrao: dev
spring.profiles.active=${SPRING_PROFILE:dev}

# Servidor
server.port=8080

# Java 21 — Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Base
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.expiration=86400000
auth.reset-password.expiration-hours=${RESET_PASSWORD_EXPIRATION_HOURS:1}
auth.email-confirmation.expiration-hours=${EMAIL_CONFIRMATION_EXPIRATION_HOURS:24}

# Recuperacao de senha
mail.reset-password-url=${RESET_PASSWORD_URL:http://localhost:3000/reset-password}
mail.confirm-email-url=${CONFIRM_EMAIL_URL:http://localhost:3000/confirm-email}

# Jooble API
jooble.api.url=https://jooble.org/api/

# Scraper
scraper.cron=0 0 6 * * ?
scraper.enabled=false
scraper.target.url=https://portal.ciee.org.br/estudantes/vagas/?cidade=Mossoro
scraper.target.card-selector=.vaga-card, .job-listing, .vacancy-item, article.vaga
scraper.target.title-selector=.titulo, .job-title, h2, h3
scraper.target.company-selector=.empresa, .company-name, .employer
scraper.target.description-selector=.descricao, .job-description, .snippet, p
scraper.target.location-selector=.localizacao, .location, .city
scraper.target.link-selector=a
scraper.target.cidade=Mossoro
