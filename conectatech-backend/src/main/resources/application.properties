# ===========================
# ConectaTech API - Configurações
# ===========================

# Servidor
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/conectatech
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=ConectaTechSecretKey2026UNPMossoroExtensaoProjetoSeguro
jwt.expiration=86400000

# Jooble API
jooble.api.url=https://jooble.org/api/
jooble.api.key=${JOOBLE_API_KEY:SUA_CHAVE_JOOBLE_AQUI}

# Scraper
scraper.cron=0 0 6 * * ?
scraper.enabled=true

# Logging
logging.level.br.com.unp.conectatech=DEBUG
logging.level.org.springframework.security=INFO
