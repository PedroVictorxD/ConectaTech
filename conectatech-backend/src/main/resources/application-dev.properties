# JPA - mostrar SQL em dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT (valor apenas para desenvolvimento local)
jwt.secret=ConectaTechDevSecretKey2026UNPMossoroExtensaoProjetoSeguroDev

# Jooble API
jooble.api.key=${JOOBLE_API_KEY:fa61f76b-ffb4-46e8-9715-72366fc3c145}

# CORS
cors.allowed-origins=*

# Logging verbose
logging.level.br.com.unp.conectatech=DEBUG
logging.level.org.springframework.security=DEBUG
